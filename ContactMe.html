<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact Me</title>

        <meta name="viewport" content="width=device-width">
        <!-- Stylesheet for full-size monitors -->
        <link href="laptop.css" rel="stylesheet" type="text/css" media="only screen and (min-width:961px)">
        <!-- Stylesheet for tablets -->
        <link href="tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width:481px) and (max-width:960px)">
        <!-- Stylesheet for smartphones -->
        <link href="mobile.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">
    </head>
    <body>
        <header>
                <h1>Contact Me</h1>
                <nav>
                    <a href="HomePage.html">Home Page</a> | <a href="ContactMe.html">Contact</a> | 
                    <a href="Projects.html">Projects</a> | <a href="AboutMe.html">About Me</a>
                </nav>
        </header>
        <article>
            <div id="formBox">
                <form action="mailto:marcus.pasco25@gmail.com?subject=Feedback"
                method="post" enctype="text/plain" name="feedback_form">
                <p>
                    <!--Section for recipient's name-->
                    <label for="Name">Your Name (Required)</label>
                    <input type="text" id="Name" size="32" placeholder="Enter your name here" required>
                </p>
                <p>
                    <!--Section for recipient's email-->
                    <label for="Email">Your Email (Required): </label>
                    <input type="email" id="Email" size="32" placeholder="Enter your email here" required>
                </p>
                <p>
                    <!--Section for recipient's Cell no.-->
                    <label for="Number">Phone Number (Optional): </label>
                    <input type="tel" id="Number" size="32" placeholder="Enter your phone number here">
                </p>
                <p>
                    <!--Section for recipient's comments-->
                    <label for="Comment">Your Comment:</label><br>
                    <textarea name="Comment" cols="60" row="6" placeholder="Enter your comment here"></textarea>
                </p>
                <button type="submit">Submit</button>
                </form>
            </div>
        </article>
        <footer>
            <p>Contact me at marcus.pasco25@gmail.com<br>
            © 2026 by Marcus Pasco</p>
        </footer>
    </body>
</html>
